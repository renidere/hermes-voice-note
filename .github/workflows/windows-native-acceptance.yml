name: Windows packaged native acceptance
on:
  push:
    branches: [windows-native-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Preserve source bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download immutable unqualified build candidate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44585499590 --repo renidere/hermes-voice-note --name windows-voice-sdk-x64 --dir candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $PWD 'candidate/Hermes-Voice-SDK-Windows-x64.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne 'ed34889048b5128343f2bc34cf7aba821dd0b6a586031d471f0dc42c4941857f') { throw 'CANDIDATE_HASH_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath client
      - name: Actual packaged SDK and Record DOM
        shell: powershell
        run: |
          $client = (Resolve-Path client).Path
          $launcher = Join-Path $client 'Start-Voice-Note.cmd'
          $proof = Join-Path $PWD 'native-proof'
          & ./tests/windows-bundled-smoke.ps1 -ClientDirectory $client -Launcher $launcher -OutputDirectory $proof
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve isolated acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-acceptance-proof
          path: native-proof/*
          retention-days: 2
          if-no-files-found: warn
